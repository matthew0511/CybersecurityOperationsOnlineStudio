name: Platform validation
on:
  pull_request:
  push:
    branches: [main, platform-expansion-20261031, security/fuzz-sql-hardening-20261101]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: studio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studio_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: src
      TEST_DATABASE_URL: postgresql://studio_test:synthetic-test-only@localhost:5432/studio_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-web.txt pytest httpx bandit pip-audit cfn-lint
      - run: python -m bandit -r src/cyberstudio/web -ll -q
      - run: python -m pip_audit -r requirements-web.txt
      - run: cfn-lint infra/platform-security.json infra/platform-runtime.json infra/platform-operations.json infra/platform-foundation.yaml
      - run: python -m pytest -q
      - run: node --test tests/ui-core.test.cjs tests/appearance.test.cjs tests/polish-core.test.cjs
      - run: npm install --prefix /tmp/studio-browser --no-audit --no-fund playwright@1.62.1 axe-core@4.10.3
      - run: /tmp/studio-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/appearance-ui.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/studio-browser/node_modules/playwright
      - run: node tests/experience-ui.cjs
        env:
          PLAYWRIGHT_MODULE: /tmp/studio-browser/node_modules/playwright
          AXE_MODULE: /tmp/studio-browser/node_modules/axe-core/axe.min.js
